interface:
  display_name: "Million-Word Novel (轮回引擎)"
  short_description: "以状态落盘 + 上下文转世的方式续写百万字长篇，达标即停止"
  default_prompt: "Use $million-word-novel to write a 1,000,000-character novel. Run scripts/novel_state.py next to get the round brief, write only the listed chapters, commit each one immediately, audit it with audit_quality.py --strict, then round-done. On REINCARNATE, write state/last-context.md and restart the loop in a fresh context. On STOP, export and stop."
